<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle Border -->
  <rect x="25" y="20" width="350" height="200" rx="30" ry="30" fill="#FFFFFF" stroke="#88D8B0" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Logo Letters ATS -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="115" filter="url(#shadow)">
    <!-- Letter A (Gold/Yellow) -->
    <text x="75" y="162" fill="#F4D35E">A</text>
    <!-- Letter T (Teal/Green) -->
    <text x="160" y="162" fill="#72D6B2">T</text>
    <!-- Letter S (Gold/Yellow) -->
    <text x="235" y="162" fill="#F4D35E">S</text>
  </g>
  
  <!-- Curved Blue Swoop Arrow under TS -->
  <path d="M 160 172 Q 220 205 295 145" fill="none" stroke="#75BBE3" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 280 142 L 302 140 L 294 162" fill="none" stroke="#75BBE3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
