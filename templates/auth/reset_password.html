{% extends "base.html" %}

{% block title %}Reset Password - Smart HRMS{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 420px;" class="card">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fas fa-lock"></i>
            </div>
            <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--text-primary);">Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Set a new password for {{ user['full_name'] }} ({{ user['emp_id'] }}).</p>
        </div>

        <form action="{{ url_for('auth.reset_password') }}" method="POST">
            <input type="hidden" name="user_id" value="{{ user['id'] }}">

            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                <i class="fas fa-save"></i> Save New Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
