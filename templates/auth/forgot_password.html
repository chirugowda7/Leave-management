{% extends "base.html" %}

{% block title %}Forgot Password - Smart HRMS{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 420px;" class="card">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 1.4rem; background: linear-gradient(135deg, #F59E0B, #D97706);">
                <i class="fas fa-key"></i>
            </div>
            <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--text-primary);">Reset Password Request</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Enter your Employee ID and Email to reset your password.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="emp_id">Employee ID</label>
                <input type="text" id="emp_id" name="emp_id" class="form-control" placeholder="e.g. EMP001" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Corporate Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. emp1@company.com" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                <i class="fas fa-paper-plane"></i> Submit Reset Request
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
            Remembered your password? <a href="{{ url_for('auth.login') }}" style="color: var(--brand-primary); font-weight: 600; text-decoration: none;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
