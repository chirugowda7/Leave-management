{% extends "base.html" %}

{% block title %}Apply for Leave - Smart HRMS{% endblock %}
{% block page_title %}Submit Leave Application{% endblock %}

{% block content %}
<div style="max-width: 780px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-paper-plane" style="color: var(--brand-primary);"></i> Smart Leave Application
            </div>
            <a href="{{ url_for('employee.history') }}" class="btn btn-secondary btn-sm">
                <i class="fas fa-history"></i> View My Requests
            </a>
        </div>

        <form action="{{ url_for('employee.apply_leave') }}" method="POST" id="applyLeaveForm">
            <div class="form-group">
                <label class="form-label" for="leave_type_id">Leave Type *</label>
                <select id="leave_type_id" name="leave_type_id" class="form-control" required>
                    <option value="">-- Select Leave Type --</option>
                    {% for b in balances %}
                    <option value="{{ b['leave_type_id'] }}">
                        {{ b['leave_type_name'] }} ({{ b['leave_type_code'] }}) - Remaining: {{ b['remaining'] }} day(s) {% if b['notice_period_days'] > 0 %}[Notice: {{ b['notice_period_days'] }}d]{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Half Day Checkbox -->
            <div class="form-group" style="background: var(--bg-primary); padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-primary);">
                    <input type="checkbox" id="is_half_day" name="is_half_day" value="1">
                    <span>Apply as Half-Day Leave</span>
                    <span class="badge badge-auto" style="margin-left: 8px;"><i class="fas fa-robot"></i> Auto-Approved</span>
                </label>
                
                <div id="half_day_session_group" style="display: none; margin-top: 12px;">
                    <label class="form-label">Select Session</label>
                    <div style="display: flex; gap: 20px;">
                        <label style="cursor: pointer; font-size: 0.85rem;"><input type="radio" name="half_day_session" value="Morning" checked> Morning Session</label>
                        <label style="cursor: pointer; font-size: 0.85rem;"><input type="radio" name="half_day_session" value="Afternoon"> Afternoon Session</label>
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label" for="start_date">Start Date *</label>
                    <input type="date" id="start_date" name="start_date" class="form-control" required min="{{ min_date }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="end_date">End Date *</label>
                    <input type="date" id="end_date" name="end_date" class="form-control" required min="{{ min_date }}">
                </div>
            </div>

            <!-- Live Working Days Display -->
            <div style="margin-bottom: 20px; font-size: 0.88rem; font-weight: 600; color: var(--brand-primary);">
                Calculated Working Duration: <span id="working_days_display">0 working day(s)</span>
            </div>

            <!-- Live Staffing Availability Checker Widget -->
            <div id="availability_checker_box" class="availability-box" style="display: none;">
                <div class="avail-header">
                    <span class="avail-text">Team Availability: --%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="avail-warning alert alert-warning" style="display: none; margin-top: 10px; font-size: 0.85rem;"></div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label class="form-label" for="reason">Reason for Leave *</label>
                <textarea id="reason" name="reason" class="form-control" placeholder="Provide a brief explanation for your leave request..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-check-circle"></i> Validate & Submit Application
            </button>
        </form>
    </div>
</div>
{% endblock %}
