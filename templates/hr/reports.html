{% extends "base.html" %}

{% block title %}Reports & Analytics - Smart HRMS{% endblock %}
{% block page_title %}Enterprise Reports & Export Hub{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-file-export" style="color: var(--brand-primary);"></i> Export Leave Reports & Analytics
        </div>
    </div>

    <form id="reportForm" action="" method="GET">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label class="form-label" for="department_id">Filter by Department</label>
                <select id="department_id" name="department_id" class="form-control">
                    <option value="">All Departments</option>
                    {% for d in departments %}
                    <option value="{{ d['id'] }}">{{ d['name'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="start_date">From Start Date</label>
                <input type="date" id="start_date" name="start_date" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label" for="end_date">To End Date</label>
                <input type="date" id="end_date" name="end_date" class="form-control">
            </div>
        </div>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; gap: 16px;">
            <button type="button" class="btn btn-success" onclick="exportReport('excel')" style="flex: 1;">
                <i class="fas fa-file-excel"></i> Export to Excel (.xlsx)
            </button>
            
            <button type="button" class="btn btn-danger" onclick="exportReport('pdf')" style="flex: 1;">
                <i class="fas fa-file-pdf"></i> Export to PDF Document
            </button>
        </div>
    </form>
</div>

<script>
function exportReport(fmt) {
    const form = document.getElementById('reportForm');
    const params = new URLSearchParams(new FormData(form)).toString();
    window.location.href = `/hr/reports/export/${fmt}?${params}`;
}
</script>
{% endblock %}
